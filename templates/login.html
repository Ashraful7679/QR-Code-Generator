{% extends 'base.html' %}

{% block content %}
<div class="glass-card" style="max-width: 400px; margin: 2rem auto;">
    <h1 style="margin-bottom: 0.5rem;">🔐 Login</h1>
    <p class="subtitle" style="margin-bottom: 2rem;">Access your dashboard</p>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div
        style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 0.75rem; border-radius: 8px; margin-bottom: 1.5rem; text-align: center;">
        {{ messages[0] }}
    </div>
    {% endif %}
    {% endwith %}

    <form method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus placeholder="Enter your username">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter your password">
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Login</button>
    </form>
</div>
{% endblock %}
